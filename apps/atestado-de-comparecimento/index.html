<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b5fa7">
<meta name="description" content="Gerador da Declaração de Comparecimento do CRAS, com histórico e impressão em A4.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../../icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Comparecimento">
<title>Declaração de Comparecimento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Carlito:wght@400;700&family=Lexend:wght@700&display=swap">
<style>
/* Layout: formulário único à esquerda, pré-visualização A4 ao vivo à direita (empilha no celular) */
:root{
  --bg:#f1f4f7; --surface:#ffffff; --fg:#17222e; --muted:#5a6a7b; --line:#d5dde5;
  --accent:#1b5fa7; --accent-fg:#ffffff; --accent-soft:#e3eef9; --ok:#23794c; --warn:#b4531a; --danger:#b3261e;
  --field:#fbfcfd; --shadow:0 1px 2px rgba(20,40,60,.08),0 8px 24px rgba(20,40,60,.08);
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151c; --surface:#16202a; --fg:#e6edf3; --muted:#93a3b3; --line:#27343f;
  --accent:#6aa9e8; --accent-fg:#0b1824; --accent-soft:#1a2c40; --ok:#5fc08a; --warn:#e69a62; --danger:#f0857d;
  --field:#111a22; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f151c; --surface:#16202a; --fg:#e6edf3; --muted:#93a3b3; --line:#27343f;
  --accent:#6aa9e8; --accent-fg:#0b1824; --accent-soft:#1a2c40; --ok:#5fc08a; --warn:#e69a62; --danger:#f0857d;
  --field:#111a22; --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark;}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- barra superior ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:10px 20px}
.brand{display:flex;flex-direction:column;margin-right:auto;min-width:0}
.brand b{font-size:16px;font-weight:600;letter-spacing:-.01em}
.brand small{color:var(--muted);font-size:12px}
.status{font-size:12px;color:var(--muted);font-family:var(--f-mono)}
.status.ok{color:var(--ok)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08);color:var(--accent-fg)}
.btn.small{padding:4px 9px;font-size:12px}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.printgrp{display:flex;gap:0}
.printgrp select{border:1px solid var(--line);border-right:0;border-radius:6px 0 0 6px;background:var(--surface);padding:7px 8px;font-size:13px}
.printgrp .btn{border-radius:0 6px 6px 0}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,560px) minmax(0,1fr);gap:24px;padding:20px;max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:1000px){.layout{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){.layout{padding:12px 16px}.top{padding:10px 16px}}

.formcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px 18px;min-width:0}
.sec>h2,.sec>summary{margin:0 0 12px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec>summary{cursor:pointer;margin:0;list-style:none}
.sec[open]>summary{margin-bottom:12px}
.sec>summary::before{content:"▸";display:inline-block;transition:transform .15s}
.sec[open]>summary::before{transform:rotate(90deg)}
.sec h2 .tag{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px 12px}
.f{display:flex;flex-direction:column;gap:3px;grid-column:span 12;min-width:0}
.s2{grid-column:span 2}.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}
@media (max-width:560px){.s2,.s3{grid-column:span 6}.s4,.s5,.s6,.s7,.s8{grid-column:span 12}}
.f>span{font-size:12px;color:var(--muted)}
.f input,.f select{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:7px 9px;width:100%;min-width:0}
.f input:hover{border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
.f input.bad{border-color:var(--danger)}
.f input.num,.f input.mono{font-family:var(--f-mono);font-size:13px}
.hint{font-size:11.5px;color:var(--muted);min-height:0}
.hint.bad{color:var(--danger)} .hint.good{color:var(--ok)}
.row-actions{grid-column:span 12;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.inline{display:flex;gap:6px}.inline input{flex:1}

/* tipos de certidão */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-weight:500;background:var(--field)}
.chip span::before{content:"";width:14px;height:14px;border-radius:50%;border:1.5px solid var(--muted)}
.chip input:checked+span{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.chip input:checked+span::before{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-soft)}
.chip input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.cert{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}
.cert>h3{margin:0 0 10px;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.cert>h3 .n{font-family:var(--f-mono);font-size:12px;color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:1px 7px}
.noteline{font-size:12px;color:var(--muted);margin:0 0 10px}

/* histórico */
.hist-tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.hist-tools input[type=search]{flex:1;min-width:140px;border:1px solid var(--line);background:var(--field);border-radius:6px;padding:6px 9px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.hist li{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.hist li:first-child{border-top:0}
.hist .info{flex:1;min-width:180px}
.hist .info b{display:block;font-weight:500}
.hist .info small{color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.hist li.cur .info b::after{content:" · aberto";color:var(--accent);font-weight:400;font-size:12px}
.empty{color:var(--muted);font-size:13px;margin:4px 0 0}

/* ---------- pré-visualização ---------- */
.prevcol{position:sticky;top:76px;min-width:0}
@media (max-width:1000px){.prevcol{position:static}}
.ptabs{display:flex;gap:4px;margin-bottom:10px;border-bottom:1px solid var(--line)}
.ptabs button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--muted)}
.ptabs button[aria-selected=true]{color:var(--accent);border-bottom-color:var(--accent)}
.ptabs .count{font-family:var(--f-mono);font-size:11px;margin-left:5px;background:var(--accent-soft);color:var(--accent);border-radius:9px;padding:0 6px}
.pvwrap{max-height:calc(100vh - 150px);overflow:auto;border-radius:8px;background:color-mix(in srgb,var(--bg) 70%,#8a98a8);padding:14px}
@media (max-width:1000px){.pvwrap{max-height:none;padding:8px}}
.pv.off{display:none}
.pv{overflow:hidden}
.scaler{transform-origin:top left;width:794px}


/* ---------- folha (sempre clara, papel) ---------- */
.sheet{background:#fff;color:#000;width:210mm;height:296mm;position:relative;overflow:hidden;margin:0;box-shadow:var(--shadow);
  font:13pt/1.5 Carlito,Calibri,"Liberation Sans",Arial,sans-serif}
.sheet *{box-sizing:border-box}
.sheet .hd{position:absolute;left:15mm;top:11mm;width:180mm;height:auto}
.sheet .ft{position:absolute;left:0;bottom:0;width:100%;height:auto}
.bd{position:absolute;left:25mm;right:22mm;top:50mm}
.sheet h1{margin:0 0 24mm;text-align:center;font:700 17pt/1.2 Lexend,Arial,sans-serif;letter-spacing:.01em}
.sheet p{margin:0}
.dt{line-height:1.9}
.par{margin-top:19mm;text-indent:14mm;text-align:justify;line-height:2.65}
.at{margin-top:17mm}
.u{display:inline-block;min-width:var(--w);max-width:100%;border-bottom:1px solid #000;text-align:center;line-height:1.25;padding:0 1.5mm;text-indent:0;vertical-align:baseline}
.dob{display:inline-flex;vertical-align:baseline;text-indent:0}
.dob span{display:inline-block;min-width:11mm;padding:0 1.5mm;text-align:center;border-bottom:1px solid #000;line-height:1.25}
.dob span+span{border-left:1px solid #000}
.sg{margin-top:20mm;padding-left:14mm}
.sg .ln{width:112mm;border-top:1px solid #000;padding-top:1mm;text-align:center;font-weight:700;min-height:6mm}
.sg small{display:block;font-weight:400;font-size:11pt}
/* toast */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:50}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


@page{size:A4;margin:0}
@media print{
  html,body{background:#fff!important}
  .top,.formcol,.toast{display:none!important}
  .layout{display:block;padding:0;max-width:none}
  .prevcol{position:static}
  .pvwrap{max-height:none!important;overflow:visible!important;padding:0!important;background:none!important}
  .pv{height:auto!important;overflow:visible!important}
  .scaler{transform:none!important;width:auto!important}
  .sheet{box-shadow:none!important}
  .sheet *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><b>Declaração de Comparecimento</b><small>CRAS · Prefeitura de São Sebastião</small></div>
  <span class="status" id="status" aria-live="polite">rascunho automático</span>
  <div class="tools">
    <button class="btn" id="btnNovo" type="button">Nova declaração</button>
    <button class="btn" id="btnSalvar" type="button">Salvar no histórico</button>
    <button class="btn primary" id="btnPrint" type="button">Imprimir / PDF</button>
  </div>
</header>

<main class="layout">
  <div class="formcol" id="formcol">
    <section class="sec">
      <h2>1 · Pessoa atendida</h2>
      <div class="grid">
        <label class="f s4"><span>Tratamento</span><select data-k="trat"><option value="">Sr. (ª) — como no modelo</option><option value="m">Sr. (masculino)</option><option value="f">Sra. (feminino)</option></select></label>
        <label class="f s8"><span>Nome completo</span><input data-k="nome" autocomplete="off" id="inNome"></label>
        <label class="f s6"><span>Data de nascimento</span><input data-k="nasc" type="date"></label>
        <label class="f s6"><span>RG</span><input data-k="rg" class="mono" autocomplete="off" inputmode="text"></label>
      </div>
    </section>

    <section class="sec">
      <h2>2 · Atendimento</h2>
      <div class="grid">
        <label class="f s4"><span>Data da declaração</span><input data-k="data" type="date"></label>
        <label class="f s4"><span>Atendimento das</span><input data-k="de" type="time"></label>
        <label class="f s4"><span>às</span><input data-k="ate" type="time"></label>
        <div class="row-actions"><button class="btn small" type="button" id="btnAgora">Usar hora atual como “às”</button></div>
      </div>
    </section>

    <details class="sec">
      <summary>Cidade e assinatura</summary>
      <div class="grid">
        <label class="f s6"><span>Cidade</span><input data-k="@cidade" autocomplete="off"></label>
        <label class="f s6"><span>Nome sob a linha de assinatura (opcional)</span><input data-k="@assin" autocomplete="off"></label>
        <label class="f s12"><span>Cargo / registro (opcional)</span><input data-k="@cargo" autocomplete="off" placeholder="ex.: Assistente Social · CRESS 00000"></label>
      </div>
    </details>

    <section class="sec">
      <h2>Histórico <span class="tag" id="histCount"></span></h2>
      <div class="hist-tools">
        <input type="search" id="histQ" placeholder="Buscar por nome ou RG" aria-label="Buscar no histórico">
        <button class="btn small" id="btnExp" type="button">Exportar backup</button>
        <label class="btn small" for="fileImp" style="cursor:pointer">Importar</label>
        <input type="file" id="fileImp" accept="application/json,.json" hidden>
      </div>
      <ul class="hist" id="hist"></ul>
      <p class="empty" id="histEmpty">Nenhuma declaração salva ainda. Os dados ficam só neste navegador; use “Exportar backup” de vez em quando.</p>
    </section>
  </div>

  <section class="prevcol" aria-label="Pré-visualização">
    <div class="pvwrap" id="pvwrap"><div class="pv" id="pv"><div class="scaler" id="scaler"></div></div></div>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
const MES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const KEY={d:"comp.draft.v1",c:"comp.cfg.v1",h:"comp.hist.v1"};
const st={get(k,f){try{const v=localStorage.getItem(k);return v?JSON.parse(v):f}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const def=()=>({id:null,data:iso(),trat:"",nome:"",nasc:"",rg:"",de:"",ate:""});
let cfg=Object.assign({cidade:"São Sebastião",assin:"",cargo:""},st.get(KEY.c,{}));
let S=Object.assign(def(),st.get(KEY.d,{}));
let hist=st.get(KEY.h,[]),dirty=false,armed=false;
const TR={"":{a:"o (a) Sr. (ª)",n:"Nascido (a)",p:"portador (a)"},m:{a:"o Sr.",n:"Nascido",p:"portador"},f:{a:"a Sra.",n:"Nascida",p:"portadora"}};
const dp=i=>{const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(i||"");return m?{d:m[3],m:m[2],mn:MES[+m[2]-1]||"",y:m[1]}:{d:"",m:"",mn:"",y:""}};
const hm=t=>t?t.replace(":","h"):"";
const u=(v,w)=>`<span class="u" style="--w:${w}">${v?esc(v):"&nbsp;"}</span>`;

function sheet(){
  const t=TR[S.trat]||TR[""],d=dp(S.data),n=dp(S.nasc);
  return `<div class="sheet"><img class="hd" src="assets/cabecalho.png" alt="Prefeitura de São Sebastião · Secretaria de Desenvolvimento Econômico e Social">
  <div class="bd"><h1>DECLARAÇÃO DE COMPARECIMENTO</h1>
  <p class="dt">${esc(cfg.cidade)}, ${u(d.d,"15mm")} de ${u(d.mn,"36mm")} de ${u(d.y,"28mm")}</p>
  <p class="par">Declaramos para os devidos fins que nesta data ${t.a} ${u(S.nome,"92mm")}, ${t.n} no dia: <span class="dob"><span>${n.d||"&nbsp;"}</span><span>${n.m||"&nbsp;"}</span><span>${n.y||"&nbsp;"}</span></span>, ${t.p} do RG ${u(S.rg,"44mm")} compareceu a este serviço para atendimento presencial com Assistente Social das ${u(hm(S.de),"20mm")} às ${u(hm(S.ate),"22mm")}.</p>
  <p class="at">Atenciosamente,</p>
  <div class="sg"><div class="ln">${esc(cfg.assin)||"&nbsp;"}${cfg.cargo?`<small>${esc(cfg.cargo)}</small>`:""}</div></div></div>
  <img class="ft" src="assets/rodape.png" alt="CRAS Boiçucanga, Topolândia e Costa Norte: endereços e telefones"></div>`;
}
function render(){$("#scaler").innerHTML=sheet();scale()}
function scale(){
  const pv=$("#pv"),sc=$("#scaler");
  const w=$("#pvwrap").clientWidth-(innerWidth>1000?28:16);
  const k=Math.min(1,Math.max(.3,w/794));
  sc.style.transform=k<1?`scale(${k})`:"none";
  pv.style.height=(sc.offsetHeight*k)+"px";
}
addEventListener("resize",scale);
if(window.ResizeObserver)new ResizeObserver(scale).observe($("#pvwrap"));

/* ---------- formulário ---------- */
function fill(){document.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;el.value=(k[0]==="@"?cfg[k.slice(1)]:S[k])??""})}
document.addEventListener("input",e=>{
  const el=e.target.closest("[data-k]");if(!el)return;
  const k=el.dataset.k;
  if(k[0]==="@"){cfg[k.slice(1)]=el.value;st.set(KEY.c,cfg)}
  else{S[k]=el.value;dirty=true;st.set(KEY.d,S)}
  render();status();
});
document.addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.shiftKey||e.isComposing)return;
  const el=e.target;if(!el.matches||!el.matches("#formcol input:not([type=file]):not([type=search]), #formcol select"))return;
  const c=[...document.querySelectorAll("#formcol input:not([type=file]):not([type=search]), #formcol select")].filter(x=>x.offsetParent!==null);
  const nx=c[c.indexOf(el)+1];e.preventDefault();
  if(nx){nx.focus();nx.scrollIntoView({block:"center",behavior:"smooth"})}else el.blur();
});
$("#btnAgora").onclick=()=>{const d=new Date();S.ate=String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0");dirty=true;st.set(KEY.d,S);fill();render();status()};

/* ---------- impressão ---------- */
$("#btnPrint").onclick=()=>{
  const old=document.title;document.title="Declaração de Comparecimento"+(S.nome?" - "+S.nome:"");
  render();setTimeout(()=>{window.print();document.title=old},60);
};
addEventListener("afterprint",scale);

/* ---------- status / toast ---------- */
let tt;
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)}
function status(){const el=$("#status");el.textContent=S.id?(dirty?"alterado, não salvo no histórico":"salvo no histórico"):"rascunho automático";el.classList.toggle("ok",!!S.id&&!dirty)}

/* ---------- histórico ---------- */
$("#btnSalvar").onclick=()=>{
  const snap=JSON.parse(JSON.stringify(S));
  if(!S.id)S.id=snap.id=Date.now();
  snap.savedAt=Date.now();
  const i=hist.findIndex(h=>h.id===S.id);
  if(i>=0)hist[i]=snap;else hist.unshift(snap);
  if(!st.set(KEY.h,hist)){toast("Não foi possível gravar no navegador. Use Exportar backup.");return}
  st.set(KEY.d,S);dirty=false;status();renderHist();toast(i>=0?"Declaração atualizada no histórico.":"Declaração salva no histórico.");
};
$("#btnNovo").onclick=()=>{
  const b=$("#btnNovo");
  if(dirty&&!armed){armed=true;b.textContent="Descartar alterações?";b.classList.add("danger");
    setTimeout(()=>{armed=false;b.textContent="Nova declaração";b.classList.remove("danger")},3500);return}
  armed=false;b.textContent="Nova declaração";b.classList.remove("danger");
  S=def();dirty=false;st.set(KEY.d,S);fill();render();status();renderHist();toast("Nova declaração iniciada.");
  $("#inNome").focus();
};
function renderHist(){
  const q=$("#histQ").value.trim().toLowerCase();
  const list=hist.filter(h=>!q||[h.nome,h.rg].join(" ").toLowerCase().includes(q));
  $("#histCount").textContent=hist.length?hist.length+" salva"+(hist.length>1?"s":""):"";
  $("#histEmpty").hidden=hist.length>0;
  $("#hist").innerHTML=list.map(h=>{
    const d=new Date(h.savedAt||h.id).toLocaleDateString("pt-BR"),a=dp(h.data);
    return `<li class="${h.id===S.id?"cur":""}"><div class="info"><b>${esc(h.nome||"Sem nome")}</b><small>${a.d?a.d+"/"+a.m+"/"+a.y:"s/ data"}${h.de?" · "+esc(hm(h.de)):""} · salva em ${d}</small></div>
    <button class="btn small" data-h="open" data-id="${h.id}" type="button">Abrir</button>
    <button class="btn small" data-h="dup" data-id="${h.id}" type="button" title="Nova declaração com os mesmos dados">Duplicar</button>
    <button class="btn small" data-h="del" data-id="${h.id}" type="button">Excluir</button></li>`}).join("");
}
$("#histQ").addEventListener("input",renderHist);
$("#hist").addEventListener("click",e=>{
  const b=e.target.closest("[data-h]");if(!b)return;
  const id=+b.dataset.id,h=hist.find(x=>x.id===id),a=b.dataset.h;if(!h)return;
  if(a==="open"||a==="dup"){
    S=Object.assign(def(),JSON.parse(JSON.stringify(h)));delete S.savedAt;
    if(a==="dup"){S.id=null;S.data=iso();dirty=true}else dirty=false;
    st.set(KEY.d,S);fill();render();status();renderHist();
    toast(a==="dup"?"Duplicada. Ajuste o que mudou.":"Declaração aberta.");
    if(innerWidth<=1000)scrollTo({top:0,behavior:"smooth"});
  }else if(a==="del"){
    if(b.dataset.armed!=="1"){b.dataset.armed="1";b.textContent="Confirmar?";b.classList.add("danger");
      setTimeout(()=>{if(b.isConnected){b.dataset.armed="";b.textContent="Excluir";b.classList.remove("danger")}},3000);return}
    hist=hist.filter(x=>x.id!==id);st.set(KEY.h,hist);if(S.id===id){S.id=null;status()}
    renderHist();toast("Declaração excluída.");
  }
});
$("#btnExp").onclick=()=>{
  const blob=new Blob([JSON.stringify({versao:1,config:cfg,declaracoes:hist},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="declaracoes-comparecimento-"+iso()+".json";
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast("Backup gerado.");
};
$("#fileImp").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const j=JSON.parse(r.result),arr=Array.isArray(j)?j:j.declaracoes;if(!Array.isArray(arr))throw 0;
      let n=0;for(const p of arr){if(!p||!p.id||hist.some(h=>h.id===p.id))continue;hist.push(Object.assign(def(),p));n++}
      hist.sort((a,b)=>(b.savedAt||b.id)-(a.savedAt||a.id));st.set(KEY.h,hist);renderHist();toast(n+" declaração(ões) importada(s).");
    }catch(err){toast("Arquivo de backup inválido.")}
    e.target.value="";
  };
  r.readAsText(f);
});

fill();render();status();renderHist();
</script>
